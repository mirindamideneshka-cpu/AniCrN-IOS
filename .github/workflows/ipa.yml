name: Build IPA
on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Web stream capture regression test
        run: node tests/stream-capture.mjs
      - name: Playlist transport regression tests
        run: |
          mkdir -p transport-tests/Sources
          cp ios/AniCrN/HLSPlaylist.swift transport-tests/Sources/HLSPlaylist.swift
          cp ios/AniCrN/HLSProxy.swift transport-tests/Sources/HLSProxy.swift
          cp ios/AniCrN/HLSHTTPTransfer.swift transport-tests/Sources/HLSHTTPTransfer.swift
          cp ios/AniCrN/MediaRouteCodec.swift transport-tests/Sources/MediaRouteCodec.swift
          cp ios/AniCrN/ProviderHTMLParser.swift transport-tests/Sources/ProviderHTMLParser.swift
          cp ios/AniCrN/HostStreamParser.swift transport-tests/Sources/HostStreamParser.swift
          cp ios/AniCrN/YummySlug.swift transport-tests/Sources/YummySlug.swift
          cp ios/AniCrN/YummyVideoParser.swift transport-tests/Sources/YummyVideoParser.swift
          swift test --package-path transport-tests
      - name: Rust tests and device library
        run: |
          rustup target add aarch64-apple-ios
          cargo test --manifest-path core/Cargo.toml
          cargo build --manifest-path core/Cargo.toml --release --target aarch64-apple-ios
      - name: Generate project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build unsigned device app
        run: xcodebuild -project ios/AniCrN.xcodeproj -scheme AniCrN -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: iOS Simulator transport tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for values in d["devices"].values() for v in values if "iPhone" in v["name"]))')
          xcodebuild test -project ios/AniCrN.xcodeproj -scheme TransportTests -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build-simulator CODE_SIGNING_ALLOWED=NO
      - name: Package for Sideloadly
        run: |
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' build/Build/Products/Release-iphoneos/AniCrN.app/Info.plist
          mkdir -p build/package/Payload
          cp -R build/Build/Products/Release-iphoneos/AniCrN.app build/package/Payload/
          cd build/package
          zip -qr ../AniCrN-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AniCrN-unsigned
          path: build/AniCrN-unsigned.ipa
