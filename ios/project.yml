name: AniCrN
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.6.0
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  AniCrN:
    type: application
    platform: iOS
    sources: [AniCrN]
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anicrn.ios
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        SWIFT_OBJC_BRIDGING_HEADER: AniCrN/Bridge.h
        LIBRARY_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/../core/target/aarch64-apple-ios/release
        OTHER_LDFLAGS: $(inherited) -lanicrn_core
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
