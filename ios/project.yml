name: AniCrN
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.6.0
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  AniCrN:
    type: application
    platform: iOS
    sources: [AniCrN]
    dependencies:
      - package: SwiftSoup
    info:
      path: AniCrN/Info.plist
      properties:
        CFBundleDisplayName: AniCrN
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anicrn.ios
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_OBJC_BRIDGING_HEADER: AniCrN/Bridge.h
        LIBRARY_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/../core/target/aarch64-apple-ios/release
        OTHER_LDFLAGS: $(inherited) -lanicrn_core
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  TransportTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../transport-tests/Tests
        excludes: [ProviderHTMLParserTests.swift, YummyVideoParserTests.swift, HostStreamParserTests.swift]
      - path: AniCrN/HLSProxy.swift
      - path: AniCrN/HLSHTTPTransfer.swift
      - path: AniCrN/HLSPlaylist.swift
      - path: AniCrN/MediaRouteCodec.swift
      - path: AniCrN/MP4ResourceLoader.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anicrn.transporttests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  AniCrN:
    build:
      targets:
        AniCrN: all
  TransportTests:
    build:
      targets:
        TransportTests: all
    test:
      targets: [TransportTests]
